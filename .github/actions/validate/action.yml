name: Validate portfolio and UI package
description: Run the same release, component, browser, build and consumer gates everywhere.
runs:
  using: composite
  steps:
    - name: Validate GitHub Actions workflows
      shell: bash
      run: |
        set -euo pipefail
        actionlint_dir=$(mktemp -d)
        trap 'rm -rf "$actionlint_dir"' EXIT
        curl --fail --silent --show-error --location \
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
          --output "$actionlint_dir/actionlint.tar.gz"
        printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
          "$actionlint_dir/actionlint.tar.gz" | sha256sum --check -
        tar -xzf "$actionlint_dir/actionlint.tar.gz" -C "$actionlint_dir" actionlint
        "$actionlint_dir/actionlint"
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
      shell: bash
    - run: npm run lint
      shell: bash
    - run: npm run test:release
      shell: bash
    - run: npm run test:ui
      shell: bash
    - run: npx playwright install --with-deps chromium
      shell: bash
    - run: npm run build
      shell: bash
    - run: npm test
      shell: bash
    - run: npm run test:e2e
      shell: bash
    - run: npm run test:package
      shell: bash
