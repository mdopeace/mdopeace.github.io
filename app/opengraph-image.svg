<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Md Mostafijur Rahman — Software engineer &amp; maker</title>
  <desc id="desc">A cream and yellow portfolio card with a Tetris handheld. Building small, useful things. Bengaluru.</desc>
  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".7" fill="#25231f" opacity=".14"/>
    </pattern>
    <pattern id="pixels" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#25231f" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#f5efdf"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <g stroke="#25231f" stroke-width="3">
    <path d="M820 24h356v582H820z" fill="#f5cb56"/>
    <path d="M24 24h796v582H24z" fill="none"/>
    <path d="M24 112h796M24 526h796"/>
  </g>
  <g fill="#25231f" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="58" y="78" font-size="22" font-weight="700" letter-spacing="2">SOFTWARE ENGINEER &amp; MAKER</text>
    <circle cx="764" cy="69" r="9" fill="#a13c24"/>
    <text x="55" y="235" font-size="84" font-weight="800" letter-spacing="-4">Md Mostafijur</text>
    <text x="55" y="329" font-size="104" font-weight="800" letter-spacing="-4" fill="#a13c24">Rahman.</text>
    <path d="M60 369h64" stroke="#a13c24" stroke-width="6"/>
    <text x="58" y="427" font-size="35" font-weight="600" letter-spacing="-.7">Building small, useful things.</text>
    <text x="59" y="473" font-size="23" fill="#57534b">Web platforms at Tracxn. Side projects after hours.</text>
    <g font-family="Courier New, monospace" font-size="20" font-weight="700">
      <text x="58" y="575">mdopeace.github.io</text>
      <text x="786" y="575" text-anchor="end">BENGALURU ↗</text>
      <text x="998" y="79" text-anchor="middle" font-size="17" letter-spacing="2">ALWAYS BUILDING</text>
    </g>
  </g>
  <!-- The yellow handheld echoes the playable Tetris console on the homepage. -->
  <g transform="translate(866 135) rotate(4 130 180)">
    <path d="M10 10h258v320l-34 38H10z" fill="#25231f"/>
    <path d="M0 0h258v320l-34 38H0z" fill="#f5cb56" stroke="#25231f" stroke-width="4"/>
    <text x="18" y="31" font-family="Courier New, monospace" font-size="13" font-weight="700" letter-spacing="1" fill="#25231f">POCKET / PLAY</text>
    <rect x="18" y="47" width="222" height="192" fill="#34342a" stroke="#25231f" stroke-width="3"/>
    <rect x="33" y="62" width="192" height="162" fill="#d5d9a0"/>
    <rect x="33" y="62" width="192" height="162" fill="url(#pixels)"/>
    <g fill="#343e2b" stroke="#d5d9a0" stroke-width="2">
      <path d="M105 80h24v24h-24zM129 80h24v24h-24zM153 80h24v24h-24zM129 104h24v24h-24z"/>
      <path d="M33 200h24v24H33zM57 200h24v24H57zM33 176h24v24H33zM57 176h24v24H57z"/>
      <path d="M81 200h24v24H81zM105 200h24v24h-24zM129 200h24v24h-24zM129 176h24v24h-24z"/>
      <path d="M153 200h24v24h-24zM177 200h24v24h-24zM177 176h24v24h-24zM201 176h24v24h-24zM201 200h24v24h-24zM201 152h24v24h-24z"/>
    </g>
    <path d="M45 261h22v20h20v22H67v20H45v-20H25v-22h20z" fill="#25231f"/>
    <circle cx="178" cy="292" r="17" fill="#a13c24" stroke="#25231f" stroke-width="3"/>
    <circle cx="222" cy="273" r="17" fill="#a13c24" stroke="#25231f" stroke-width="3"/>
    <path d="M108 330h24m10 0h24" stroke="#25231f" stroke-width="7"/>
  </g>
  <text x="998" y="562" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#25231f">IDEA → BUILD → REPEAT</text>
</svg>
